services:
  # MongoDB: 儲存訊息歷史
  mongodb:
    image: mongo:latest
    container_name: im-mongo
    # 關鍵：啟用 Replica Set 模式，讓 Python 可以使用 .watch() 監聽
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Redis: 儲存用戶在線狀態 (Go 會頻繁使用)
  redis:
    image: redis:alpine
    container_name: im-redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:
